# ASSERT – website + CMS with Docker.
#   cp .env.docker.example .env   (edit the values)
#   docker compose up -d --build
# Website: http://localhost:3000   Admin: http://localhost:4000/admin
services:
  cms:
    build: ./backend
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${CMS_PUBLIC_URL:-http://localhost:4000}
      FRONTEND_URL: http://web:3000
      CORS_ORIGINS: ${SITE_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?Set REVALIDATE_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@assert.gr}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CONTACT_WEBHOOK_URL: ${CONTACT_WEBHOOK_URL:-}
    volumes:
      - ./docker-data:/app/storage   # JSON database + uploads (back this folder up)
    ports:
      - "${CMS_PORT:-4000}:4000"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      cms:
        condition: service_healthy
    environment:
      API_URL: http://cms:4000
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?Set REVALIDATE_SECRET in .env}
    ports:
      - "${WEB_PORT:-3000}:3000"
